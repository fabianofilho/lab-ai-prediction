name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          # apenas o necessário para os testes offline (sem o stack pesado de ML).
          # scikit-learn e optuna cobrem split e HPO (tests/test_validacao.py);
          # requests e pyarrow cobrem o upload (tests/test_upload.py).
          pip install pandas numpy scikit-learn optuna requests pyarrow

      - name: Lint (ruff)
        run: ruff check core pages tests || true

      - name: Testes offline (invariantes, sem rede)
        run: pytest -m "not network" -q
